name: Build and publish latest

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: guiok-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify plugin and resource pack
        run: bash ./gradlew clean check jar apiJar resourcePackZip --stacktrace --no-daemon

      - name: Publish rolling latest assets
        if: >-
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/libs/GuiOk.jar GuiOk.jar
          cp build/libs/GuiOk-api.jar GuiOk-api.jar
          cp build/distributions/GuiOkResourcePack.zip GuiOkResourcePack.zip
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Latest verified build" \
              --notes "Rolling build from commit $GITHUB_SHA. Assets are replaced only after all checks pass."
          else
            gh release create latest \
              --title "Latest verified build" \
              --notes "Rolling build from commit $GITHUB_SHA. Assets are replaced only after all checks pass."
          fi
          gh release upload latest GuiOk.jar GuiOk-api.jar GuiOkResourcePack.zip --clobber
