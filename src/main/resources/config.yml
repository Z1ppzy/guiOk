# GuiOk by Z1ppzy downloads a tiny font resource pack and renders the packed title.
# The bundled GitHub URL works only while this repository/release is public.
resource-pack:
  enabled: true
  url: "https://github.com/Z1ppzy/guiOk/releases/download/latest/GuiOkResourcePack.zip"
  id: "762e72f3-2ff5-4a8b-8b97-4dba960fd660"
  sha1: "auto"
  required: false
  replace-existing-packs: false
  send-on-join: true
  # Задержка перед отправкой пака. 0 — сразу на следующем тике после входа.
  # Если промпт начнёт проскакивать, не дав игроку нажать «принять», поднимите
  # до 5 тиков: клиенту хватает четверти секунды, чтобы устаканиться.
  delay-ticks: 0
  prompt: "<green>Загрузить оформление сервера?</green> <gray>Без него останется обычный текстовый HUD.</gray>"

sidebar:
  enabled: true
  # false — показать sidebar сразу с текстовым заголовком и переключить его на
  # packed, когда пак применится. Игрок никогда не остаётся без HUD, но видит
  # подмену заголовка. true — HUD появляется только вместе с паком, без подмены,
  # но до этого момента экран пустой.
  wait-for-pack: false
  fallback-on-pack-failure: true
  replace-existing-scoreboard: true
  refresh-ticks: 20
  title-with-pack: "<font:guiok:hud><white></white></font>"
  title-without-pack: "<gradient:#80ff00:#ffffff><bold>PRISON</bold></gradient>"
  lines:
    - ""
    - "<gray>Игрок:</gray> <white><player></white>"
    - "<gray>Мир:</gray> <white><world></white>"
    # Баланс приходит из PlaceholderAPI, поэтому подходит любой плагин экономики
    # и любая валюта: CMI — cmi_user_balance_formatted, Vault — vault_eco_balance.
    - "<green><papi:cmi_user_balance_formatted></green><icon:coin>"
    - "<gray>Онлайн:</gray> <white><online>/<max_online></white>"
    # Тем же способом выводится что угодно из ваших плагинов — ранг, шахта, престиж:
    # - "<gray>Ранг:</gray> <white><papi:prison_rank></white>"

messages:
  prefix: "<gradient:#80ff00:#ffffff><bold>GuiOk</bold></gradient> <dark_gray>»</dark_gray> "
  no-permission: "<red>Недостаточно прав.</red>"
  reloaded: "<green>Конфигурация перезагружена.</green>"
  hidden: "<gray>Sidebar скрыт. Повторите <white>/guiok toggle</white>, чтобы вернуть его.</gray>"
  shown: "<green>Sidebar включён.</green>"
  pack-resent: "<green>Ресурспак отправлен повторно.</green>"
