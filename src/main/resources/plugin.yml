name: GuiOk
version: '${version}'
main: dev.z1ppzy.guiok.GuiOkPlugin
description: Custom resource-pack logo and configurable per-player sidebar for Paper
authors: [Z1ppzy]
api-version: '26.1.2'
softdepend: [PlaceholderAPI, Vault]
commands:
  guiok:
    description: GuiOk sidebar, diagnostics and resource-pack controls
    usage: /guiok [help|toggle|resend|version|status|reload]
    aliases: [hud]
    permission: guiok.use
permissions:
  guiok.use:
    description: Use player GuiOk commands
    default: true
  guiok.admin:
    description: Reload GuiOk and inspect detailed diagnostics
    default: op
