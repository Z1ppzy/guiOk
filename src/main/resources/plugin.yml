name: GuiOk
version: '${version}'
main: dev.z1ppzy.guiok.GuiOkPlugin
description: GuiOk by Z1ppzy — resource-pack HUD and namespaced custom item API for Paper
authors: [Z1ppzy]
website: https://github.com/Z1ppzy/guiOk
api-version: '26.1.2'
softdepend: [PlaceholderAPI, Vault]
commands:
  guiok:
    description: GuiOk HUD, custom items, diagnostics and resource-pack controls
    usage: /guiok [help|toggle|resend|version|status|items|give|reload]
    aliases: [hud]
    permission: guiok.use
permissions:
  guiok.use:
    description: Use player GuiOk commands
    default: true
  guiok.admin:
    description: Reload GuiOk and inspect detailed diagnostics
    default: op
